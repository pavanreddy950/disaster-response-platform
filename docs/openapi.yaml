openapi: 3.0.3
info:
  title: Disaster Response Coordination API
  version: 1.0.0
  description: |
    Backend for creating disaster incidents, resolving their locations, finding nearby resources
    and retrieving community reports.

    **Auth (mock):** send `Authorization: Bearer <token>`.
    | token | user | role |
    |---|---|---|
    | `admin-token` | admin | admin |
    | `contributor-token` | contributor1 | contributor |
    | `contributor2-token` | contributor2 | contributor |

    **Errors** always use the envelope `{ "error": { "code", "message", "details?", "request_id" } }`.

    **Request ids:** every response carries `X-Request-Id`. A client-supplied `X-Request-Id` matching
    `^[A-Za-z0-9._-]{1,64}$` is echoed back; otherwise the server generates a UUID. The same id appears
    in `error.request_id` and in the server log line.

    **Rate limiting:** `POST`, `PATCH` and `DELETE` requests are limited to
    `RATE_LIMIT_WRITES_PER_MINUTE` (default 60) per fixed one-minute window, per authenticated user
    (or per client IP when no valid token is sent). Excess requests get **429 `RATE_LIMITED`** with
    a `Retry-After` header (seconds). Reads are not limited.

    **Incident lifecycle:** `reported → verified → active ⇄ contained → resolved`; every open status may
    also go straight to `resolved` (from `reported`/`verified` that means false alarm / duplicate).
    Reopening (`resolved → active`) is admin-only. `GET /lifecycle` returns the table.

    **Real-time:** `GET /events` is a Server-Sent Events stream emitting `disaster_created`,
    `disaster_updated` and `disaster_deleted`.
servers:
  - url: http://localhost:3000
tags:
  - name: Disasters
  - name: Resources
  - name: Reports
  - name: Realtime
  - name: Dashboard
security: []
paths:
  /disasters:
    post:
      tags: [Disasters]
      summary: Create a disaster (admin, contributor)
      description: |
        Location is resolved in this order: explicit `lat`/`lng` → `location_name` geocoded →
        place extracted from `description` and geocoded. If geocoding fails the disaster is still
        created with `location.source = "unresolved"`.
        Initial `status` may be `reported` (default), `verified` or `active`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDisaster' }
            example:
              title: Manhattan flooding
              description: Heavy flooding has affected Manhattan, NYC.
              tags: [flood, urban]
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disaster' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Disasters]
      summary: List disasters (newest first)
      parameters:
        - { name: tag, in: query, schema: { type: string }, example: flood }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: created_by, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Disaster' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /disasters/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Disasters]
      summary: Get a disaster
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disaster' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Disasters]
      summary: Update a disaster (admin any; contributor own only)
      description: |
        Partial update. Status changes must follow the lifecycle (see `GET /lifecycle`):

        | from | allowed to |
        |---|---|
        | reported | verified, resolved |
        | verified | active, resolved |
        | active | contained, resolved |
        | contained | active, resolved |
        | resolved | active (**admin only**) |

        Setting the current status again is a no-op. Checks run in this order: ownership (403),
        reopen-by-non-admin (403), illegal transition (409 `INVALID_STATUS_TRANSITION`).
        Location is re-resolved only when `lat/lng`, `location_name` or `description` change.

        Every effective change is written to the audit trail (`GET /disasters/{id}/history`) in the same
        transaction. A PATCH that changes nothing returns the disaster unchanged (200) without bumping
        `updated_at`, writing an audit entry or emitting an SSE event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDisaster' }
            example: { status: verified }
      responses:
        '200':
          description: Updated (or unchanged, for a no-op PATCH)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disaster' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Status change not allowed by the lifecycle (`INVALID_STATUS_TRANSITION`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: INVALID_STATUS_TRANSITION
                  message: Cannot change status from reported to contained
                  details: { from: reported, to: contained, allowed: [verified, resolved] }
                  request_id: 3f2b7c1e-8d4a-4c1b-9e0f-2a6d5b7c8e91
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Disasters]
      summary: Delete a disaster (admin only, soft delete)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /disasters/{id}/history:
    get:
      tags: [Disasters]
      summary: Audit trail of a disaster, newest first
      description: |
        One entry per committed change: `created`, `updated`, `status_changed` (any change that
        includes `status`; other changed fields are listed too) and `deleted`. `changes` maps each changed
        field (`title`, `description`, `tags`, `status`, `location.name`, `location.lat`,
        `location.lng`, `location.source`) to `{ from, to }`; it is `{}` for `created` and `deleted`.
        Deleted disasters return 404, like every other read.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
              example:
                data:
                  - id: 3
                    action: status_changed
                    actor: admin
                    changes: { status: { from: reported, to: verified } }
                    at: '2026-10-25T10:05:00.000Z'
                  - id: 1
                    action: created
                    actor: contributor1
                    changes: {}
                    at: '2026-10-25T10:00:00.000Z'
        '404': { $ref: '#/components/responses/NotFound' }
  /lifecycle:
    get:
      tags: [Disasters]
      summary: The disaster status state machine
      description: Lets clients offer only valid status changes instead of duplicating the rules.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lifecycle' }
              example:
                statuses: [reported, verified, active, contained, resolved]
                initial: [reported, verified, active]
                transitions:
                  reported: [verified, resolved]
                  verified: [active, resolved]
                  active: [contained, resolved]
                  contained: [active, resolved]
                  resolved: [active]
                admin_only: [{ from: resolved, to: active }]
  /stats:
    get:
      tags: [Dashboard]
      summary: Dashboard counters
      description: |
        Counts of live (non-deleted) disasters per status and resources per type. Every status and
        resource type is always present (zero-filled). `unresolved_locations` counts live disasters
        whose location could not be resolved.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
              example:
                disasters:
                  total: 5
                  by_status: { reported: 1, verified: 1, active: 1, contained: 1, resolved: 1 }
                  unresolved_locations: 0
                resources:
                  total: 21
                  by_type: { shelter: 7, hospital: 6, food: 3, water: 2, rescue: 3, medical: 0, other: 0 }
  /disasters/{id}/resources:
    get:
      tags: [Resources]
      summary: Resources near a disaster, nearest first
      description: |
        Centre is `lat`/`lng` when provided, otherwise the disaster's resolved coordinates.
        Uses an R*Tree bounding-box lookup followed by an exact haversine filter.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius, in: query, description: Radius in km, schema: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 200, default: 10 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ResourceType' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  center:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      source: { type: string, enum: [query, disaster] }
                  radius_km: { type: number }
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Resource'
                        - type: object
                          properties:
                            distance_km: { type: number }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Disaster has no coordinates and none were supplied (`LOCATION_UNRESOLVED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /disasters/{id}/reports:
    get:
      tags: [Reports]
      summary: Community reports for a disaster (cached, prioritised)
      description: |
        Fetched from the (mock) social-media service using the disaster's location name, normalised,
        classified by priority and sorted high → low. Responses carry `X-Cache: HIT | MISS | STALE`.
        If the upstream fails, a stale cached copy is served when available; otherwise 503.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string, enum: [high, medium, low] } }
      responses:
        '200':
          description: OK
          headers:
            X-Cache: { schema: { type: string, enum: [HIT, MISS, STALE] } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Report' } }
                  meta:
                    type: object
                    properties:
                      query: { type: string }
                      cache: { type: string, enum: [HIT, MISS, STALE] }
                      fetched_at: { type: string, format: date-time }
                      count: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Upstream unavailable and nothing cached (`UPSTREAM_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /resources:
    get:
      tags: [Resources]
      summary: List resources
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ResourceType' } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: OK }
    post:
      tags: [Resources]
      summary: Create a resource (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, lat, lng]
              properties:
                name: { type: string }
                type: { $ref: '#/components/schemas/ResourceType' }
                location_name: { type: string }
                lat: { type: number }
                lng: { type: number }
            example: { name: 'Red Cross Shelter', type: shelter, location_name: 'Lower East Side', lat: 40.715, lng: -73.984 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /events:
    get:
      tags: [Realtime]
      summary: Server-Sent Events stream
      description: |
        Emits `connected`, then `disaster_created`, `disaster_updated`, `disaster_deleted` with
        `data: { type, disaster, actor, at }`. Optional `?disaster_id=` to follow one incident.
        Try it: `curl -N http://localhost:3000/events`
      parameters:
        - { name: disaster_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: text/event-stream
  /health:
    get:
      summary: Liveness / DB check
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    X-Request-Id:
      description: Request correlation id (echoed if supplied and well-formed, otherwise generated). Sent on every response.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
  responses:
    RateLimited:
      description: Too many write requests in the current window (`RATE_LIMITED`)
      headers:
        Retry-After:
          description: Seconds until the window resets
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: RATE_LIMITED
              message: Too many write requests; retry in 42s
              details: { limit_per_minute: 60, retry_after_seconds: 42 }
              request_id: 3f2b7c1e-8d4a-4c1b-9e0f-2a6d5b7c8e91
    ValidationError:
      description: Validation failed (`VALIDATION_ERROR`) or malformed JSON (`INVALID_JSON`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details: [{ field: title, message: 'Too small: expected string to have >=3 characters' }]
              request_id: 3f2b7c1e-8d4a-4c1b-9e0f-2a6d5b7c8e91
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Status:
      type: string
      enum: [reported, verified, active, contained, resolved]
    ResourceType:
      type: string
      enum: [shelter, hospital, food, water, rescue, medical, other]
    Location:
      type: object
      properties:
        name: { type: string, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        source: { type: string, enum: [client, geocoded, unresolved] }
    Disaster:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        location: { $ref: '#/components/schemas/Location' }
        tags: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/Status' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDisaster:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        location_name: { type: string, description: Overrides extraction from description }
        lat: { type: number, minimum: -90, maximum: 90, description: Must be sent together with lng }
        lng: { type: number, minimum: -180, maximum: 180 }
        tags: { type: array, maxItems: 10, items: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' } }
        status: { type: string, enum: [reported, verified, active], default: reported }
    UpdateDisaster:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string }
        description: { type: string }
        location_name: { type: string }
        lat: { type: number }
        lng: { type: number }
        tags: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/Status' }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, description: Monotonic; orders entries even when timestamps are equal }
        action: { type: string, enum: [created, updated, status_changed, deleted] }
        actor: { type: string, description: User id that made the change }
        changes:
          type: object
          description: Changed fields, keyed by field path
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}
        at: { type: string, format: date-time }
    Lifecycle:
      type: object
      properties:
        statuses: { type: array, items: { $ref: '#/components/schemas/Status' } }
        initial: { type: array, description: Statuses allowed on create, items: { $ref: '#/components/schemas/Status' } }
        transitions:
          type: object
          description: For each status, the statuses it may move to
          additionalProperties: { type: array, items: { $ref: '#/components/schemas/Status' } }
        admin_only:
          type: array
          description: Transitions only admins may perform
          items:
            type: object
            properties:
              from: { $ref: '#/components/schemas/Status' }
              to: { $ref: '#/components/schemas/Status' }
    Stats:
      type: object
      properties:
        disasters:
          type: object
          properties:
            total: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
            unresolved_locations: { type: integer }
        resources:
          type: object
          properties:
            total: { type: integer }
            by_type: { type: object, additionalProperties: { type: integer } }
    Resource:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { $ref: '#/components/schemas/ResourceType' }
        location:
          type: object
          properties:
            name: { type: string, nullable: true }
            lat: { type: number }
            lng: { type: number }
        created_at: { type: string, format: date-time }
    Report:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        user: { type: string }
        created_at: { type: string, format: date-time }
        source: { type: string }
        priority: { type: string, enum: [high, medium, low] }
    Pagination:
      type: object
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            request_id: { type: string, description: Same value as the X-Request-Id response header }
